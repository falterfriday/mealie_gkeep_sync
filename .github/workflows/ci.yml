name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type check, test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Mypy (strict)
        run: mypy src

      - name: Pytest
        run: pytest -q --cov=mealie_gkeep_sync --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  container:
    name: Build image and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: mealie-gkeep-sync:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image runs as non-root
        run: |
          user="$(docker image inspect mealie-gkeep-sync:ci --format '{{.Config.User}}')"
          echo "image user: ${user}"
          test "${user}" = "1000:1000"
          docker run --rm --entrypoint id mealie-gkeep-sync:ci | tee /dev/stderr | grep -q 'uid=1000'

      - name: Missing configuration exits 2 with a readable error
        run: |
          set +e
          output="$(docker run --rm mealie-gkeep-sync:ci 2>&1)"
          code=$?
          set -e
          echo "${output}"
          test "${code}" -eq 2
          echo "${output}" | grep -q 'MEALIE_BASE_URL'
          echo "${output}" | grep -q 'GOOGLE_MASTER_TOKEN'

      - name: Runtime smoke test under production security constraints
        run: |
          # --network none keeps this hermetic: no outbound auth attempts to Google or
          # Mealie from CI. The sync loop fails to connect, which is exactly the state
          # we want to assert on - the process must stay up and stay inspectable.
          docker run -d --name smoke \
            --network none \
            --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            -e MEALIE_BASE_URL=http://mealie.invalid \
            -e MEALIE_API_TOKEN=ci-fake \
            -e MEALIE_LIST_NAME=Groceries \
            -e GOOGLE_EMAIL=ci@example.invalid \
            -e GOOGLE_MASTER_TOKEN=aas_et/ci-fake \
            -e KEEP_LIST_NAME=Groceries \
            -e LOG_FORMAT=json \
            -e SYNC_INTERVAL_SECONDS=5 \
            mealie-gkeep-sync:ci
          sleep 20
          docker logs smoke

          echo "::group::container stayed up (no crash-loop on failure)"
          test "$(docker inspect smoke --format '{{.State.Running}}')" = "true"
          echo "::endgroup::"

          echo "::group::liveness green, readiness red"
          probe() {
            docker exec smoke python -c "
          import json, sys, urllib.error, urllib.request
          try:
              r = urllib.request.urlopen('http://127.0.0.1:8080$1', timeout=5)
              print(r.status)
          except urllib.error.HTTPError as e:
              print(e.code)
          "
          }
          test "$(probe /healthz)" = "200"
          test "$(probe /readyz)" = "503"
          echo "::endgroup::"

          echo "::group::root filesystem is read-only, /data is writable"
          # An `if` condition, not `&&`: a failing command in an && list would trip
          # `set -e` and fail the step on the very outcome we want.
          if docker exec smoke sh -c 'touch /probe' 2>/dev/null; then
            echo "root filesystem was writable, expected read-only"
            exit 1
          fi
          docker exec smoke sh -c 'touch /data/.probe && rm /data/.probe'
          echo "::endgroup::"

          echo "::group::logs are valid JSON"
          docker logs smoke 2>&1 | python -c "
          import json, sys
          count = 0
          for line in sys.stdin:
              line = line.strip()
              if line:
                  json.loads(line)
                  count += 1
          assert count, 'no log lines emitted'
          print(f'{count} lines parsed')
          "
          echo "::endgroup::"

          echo "::group::graceful shutdown on SIGTERM"
          docker stop -t 15 smoke
          test "$(docker inspect smoke --format '{{.State.ExitCode}}')" = "0"
          echo "::endgroup::"

      - name: Cleanup
        if: always()
        run: docker rm -f smoke 2>/dev/null || true

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    env:
      CHART: deploy/mealie-gkeep-sync
      CI_VALUES: deploy/mealie-gkeep-sync/ci/test-values.yaml
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5.0.1

      - name: Lint
        run: helm lint "$CHART" --values "$CI_VALUES"

      - name: Render
        run: |
          helm template mealie-gkeep-sync "$CHART" --values "$CI_VALUES" > /tmp/rendered.yaml
          echo "rendered $(grep -c '^kind:' /tmp/rendered.yaml) objects"
          cat /tmp/rendered.yaml

      - name: Validate against Kubernetes API schemas
        run: |
          docker run --rm -i ghcr.io/yannh/kubeconform:latest \
            -strict -summary -kubernetes-version 1.31.0 - < /tmp/rendered.yaml

      - name: Rendered Deployment preserves the operational invariants
        run: |
          # These are not style preferences. Recreate + a single replica is what stops
          # two syncers racing on one list pair and one ReadWriteOnce volume.
          python - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open("/tmp/rendered.yaml")) if d]
          dep = next(d for d in docs if d["kind"] == "Deployment")
          spec = dep["spec"]
          container = spec["template"]["spec"]["containers"][0]
          assert spec["replicas"] == 1, spec["replicas"]
          assert spec["strategy"]["type"] == "Recreate", spec["strategy"]
          assert container["securityContext"]["readOnlyRootFilesystem"] is True
          assert container["securityContext"]["allowPrivilegeEscalation"] is False
          assert spec["template"]["spec"]["securityContext"]["runAsNonRoot"] is True
          assert container["livenessProbe"]["httpGet"]["path"] == "/healthz"
          assert container["readinessProbe"]["httpGet"]["path"] == "/readyz"
          mounts = {m["name"]: m["mountPath"] for m in container["volumeMounts"]}
          assert mounts == {"state": "/data", "tmp": "/tmp"}, mounts
          annotations = spec["template"]["metadata"]["annotations"]
          assert "checksum/config" in annotations, "config changes must roll the pod"
          print("all invariants hold")
          PY

      - name: Guard rails reject unsafe or incomplete values
        run: |
          must_fail() {
            desc="$1"; shift
            if helm template guard "$CHART" "$@" >/dev/null 2>&1; then
              echo "::error::chart accepted a configuration it should reject: ${desc}"
              exit 1
            fi
            echo "  rejected: ${desc}"
          }
          must_fail "replicaCount above 1"   --values "$CI_VALUES" --set replicaCount=2
          must_fail "missing credentials"    --set mealie.baseUrl=http://m --set google.email=a@b.c
          must_fail "no list id or name"     --values "$CI_VALUES" --set mealie.listName=null
          must_fail "empty mealie.baseUrl"   --values "$CI_VALUES" --set mealie.baseUrl=""
          must_fail "unknown conflict rule"  --values "$CI_VALUES" --set sync.conflictStrategy=bogus
          must_fail "misspelled value key"   --values "$CI_VALUES" --set mealie.baseURL=http://typo

      - name: Supported configurations still render
        run: |
          must_render() {
            desc="$1"; shift
            if ! helm template ok "$CHART" "$@" >/dev/null 2>&1; then
              echo "::error::chart rejected a supported configuration: ${desc}"
              exit 1
            fi
            echo "  rendered: ${desc}"
          }
          must_render "replicaCount=0 (paused)"  --values "$CI_VALUES" --set replicaCount=0
          must_render "existing secret"          --values "$CI_VALUES" --set secrets.existingSecret=creds
          must_render "existing claim"           --values "$CI_VALUES" --set persistence.existingClaim=pvc
          must_render "persistence disabled"     --values "$CI_VALUES" --set persistence.enabled=false
          must_render "list by id"               --values "$CI_VALUES" --set mealie.listId=abc-123
