name: Release chart

# Publishes charts/* to the gh-pages Helm repository. Runs only after a change
# lands on main, so pull requests never publish.
#
# One-time setup, both manual (see README):
#   1. create an orphan `gh-pages` branch
#   2. Settings > Pages > deploy from branch `gh-pages`
on:
  push:
    branches: [main]
    paths:
      - "charts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never let two releases race to rewrite index.yaml on gh-pages.
  group: chart-release
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the GitHub Release and push the index to gh-pages.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # chart-releaser compares tags across history to decide what is new.
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: azure/setup-helm@v5.0.1

      - name: Ensure the gh-pages branch exists
        run: |
          # chart-releaser checks out origin/gh-pages to update index.yaml and fails
          # with "fatal: invalid reference: origin/gh-pages" if the branch is absent.
          # Create it as an empty root commit using plumbing, so nothing is checked
          # out and the packaged charts in .cr-release-packages survive untouched.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages already exists."
            exit 0
          fi

          echo "gh-pages is missing; creating it."
          empty_tree="$(git hash-object -t tree /dev/null)"
          commit="$(git commit-tree "${empty_tree}" -m 'Initialise gh-pages for chart releases')"
          git push origin "${commit}:refs/heads/gh-pages"
          echo "Created gh-pages. Enable Settings > Pages on this branch to serve the repo over HTTPS."

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          # Makes re-runs idempotent: a chart whose version already has a release
          # is skipped instead of failing the workflow.
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
