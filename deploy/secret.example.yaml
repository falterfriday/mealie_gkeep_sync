# Copy to secret.yaml, fill in, and DO NOT commit it (.gitignore already excludes it).
#
# GOOGLE_MASTER_TOKEN is password-equivalent: it grants full access to the Google
# account, not just Keep. Strongly consider a dedicated Google account that owns only
# the shared shopping list. Generate the token with tools/get_master_token.py.
#
# Prefer a real secrets manager if you run one:
#   kubectl create secret generic mealie-gkeep-sync \
#     --from-literal=MEALIE_API_TOKEN='...' \
#     --from-literal=GOOGLE_MASTER_TOKEN='aas_et/...'
apiVersion: v1
kind: Secret
metadata:
  name: mealie-gkeep-sync
  labels:
    app.kubernetes.io/name: mealie-gkeep-sync
type: Opaque
stringData:
  # Mealie: user profile -> Manage Your API Tokens -> Generate
  MEALIE_API_TOKEN: "replace-me"
  # Starts with "aas_et/"
  GOOGLE_MASTER_TOKEN: "replace-me"
