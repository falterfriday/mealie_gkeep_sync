apiVersion: v1
kind: ConfigMap
metadata:
  name: mealie-gkeep-sync
  labels:
    app.kubernetes.io/name: mealie-gkeep-sync
data:
  # --- Mealie ---------------------------------------------------------------
  # In-cluster service URL is usually right; must point at the Mealie root.
  MEALIE_BASE_URL: "http://mealie.mealie.svc.cluster.local:9000"
  # Identify the list by name, or set MEALIE_LIST_ID for an exact UUID match.
  MEALIE_LIST_NAME: "Groceries"

  # --- Google Keep ----------------------------------------------------------
  GOOGLE_EMAIL: "shopping@example.com"
  KEEP_LIST_NAME: "Groceries"
  KEEP_CREATE_LIST_IF_MISSING: "false"

  # --- Sync behaviour -------------------------------------------------------
  SYNC_INTERVAL_SECONDS: "60"
  # newest | mealie | keep
  CONFLICT_STRATEGY: "newest"
  PARSE_INGREDIENTS: "true"
  PARSER_MIN_CONFIDENCE: "0.6"
  # Leave false so shopping-list typos never create food records.
  CREATE_MISSING_FOODS: "false"
  # Flip to "true" for a read-only first run that logs the plan without writing.
  DRY_RUN: "false"

  # --- Operational ----------------------------------------------------------
  STATE_DIR: "/data"
  HEALTH_PORT: "8080"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
