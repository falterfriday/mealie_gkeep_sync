{{- if not .Values.secrets.existingSecret }}
{{/*
Rendered only when the user has not supplied their own Secret. Values placed here
are stored in the release manifest inside the cluster, so secrets.existingSecret
remains the better option for anything you care about.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mealie-gkeep-sync.fullname" . }}
  labels:
    {{- include "mealie-gkeep-sync.labels" . | nindent 4 }}
type: Opaque
stringData:
  MEALIE_API_TOKEN: {{ .Values.secrets.mealieApiToken | quote }}
  # Password-equivalent access to the Google account, not a scoped key.
  GOOGLE_MASTER_TOKEN: {{ .Values.secrets.googleMasterToken | quote }}
{{- end }}
