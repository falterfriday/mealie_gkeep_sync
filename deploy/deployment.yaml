apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie-gkeep-sync
  labels:
    app.kubernetes.io/name: mealie-gkeep-sync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mealie-gkeep-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mealie-gkeep-sync
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: ghcr.io/REPLACE_ME/mealie-gkeep-sync:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: mealie-gkeep-sync
            - secretRef:
                name: mealie-gkeep-sync
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: mealie-gkeep-sync-state
        - name: tmp
          emptyDir: {}
